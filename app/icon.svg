<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Eluna Mind">
  <!--
    The favicon.

    Not the full mark: at 16 pixels the brain folds turn to mud and the whole
    thing reads as a grey smudge. What survives at that size is the silhouette,
    the seam and the light on it, so that is all this draws — thicker strokes,
    nothing finer than a pixel and a half, and a dark tile behind it so it holds
    its shape on a white browser tab as well as a dark one.

    The colours are literal rather than var(--s1); a favicon is rendered outside
    the page and has no stylesheet to read them from.
  -->
  <defs>
    <linearGradient id="sweep" x1="10" y1="32" x2="54" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00f0d4"/>
      <stop offset="0.3" stop-color="#00b4fc"/>
      <stop offset="0.58" stop-color="#575af9"/>
      <stop offset="0.78" stop-color="#9653fa"/>
      <stop offset="1" stop-color="#e838fd"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#05060e"/>

  <g stroke="url(#sweep)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M29.6 14.2c-5.4-2.5-11.1.1-12.8 5-4.4.8-7.1 4.6-6.4 8.6-3.3 2.5-3.6 7.1-.8 9.9-1.4 4.2 1.2 8.3 5.5 9 1 4.2 5.3 6.7 9.4 5.3 1.5 2.2 3.7 3.2 5.1 3.2"/>
    <path d="M34.4 14.2c5.4-2.5 11.1.1 12.8 5 4.4.8 7.1 4.6 6.4 8.6 3.3 2.5 3.6 7.1.8 9.9 1.4 4.2-1.2 8.3-5.5 9-1 4.2-5.3 6.7-9.4 5.3-1.5 2.2-3.7 3.2-5.1 3.2"/>
  </g>

  <!--
    The glow is deliberately small. At 64 pixels a wide spark looks beautiful;
    at 16 it swallows the seam and both inner edges, and the icon stops being a
    brain and becomes a dot in a dark square. Radius 7 is the largest that still
    leaves the silhouette readable in a browser tab.
  -->
  <line x1="32" y1="13" x2="32" y2="51" stroke="url(#sweep)" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>
  <circle cx="32" cy="32" r="7" fill="url(#spark)"/>
  <circle cx="32" cy="32" r="2.9" fill="#ffffff"/>
</svg>
